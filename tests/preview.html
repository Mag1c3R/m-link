<!doctype html><meta charset="utf-8"><title>popup preview</title>
<link rel="stylesheet" href="../extension/popup.css">
<style>html{background:#888}body{margin:20px auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
html.bare{background:transparent}html.bare body{margin:0;box-shadow:none}
/* для скриншотов: без анимаций, иначе кадр может поймать середину перехода */
html.bare *,html.bare *::before,html.bare *::after{transition:none!important}</style>
<script type="module">
// Заглушка chrome.* для просмотра popup вне расширения.
//   ?empty=1           — пустое состояние
//   ?state=on|error    — подключено / ошибка
//   ?nohelper=1        — помощник не установлен (карточка установки); ?os=win|mac|linux
//   ?oldhelper=1       — помощник устарел; ?update=1 — доступна новая версия помощника
//   ?demo=1            — красивые демо-данные для скриншотов магазина
//   ?view=settings     — сразу открыть настройки
//   ?add=<текст>       — открыть панель добавления с этим текстом
//   ?bare=1            — без серого фона и тени (для вставки в iframe)
//   ?ui=en             — язык браузера (английский интерфейс и английские демо-данные)
import { parseSubscription, parseLink } from '../extension/lib/parser.js';
const q = new URLSearchParams(location.search);
if (q.get('bare')) document.documentElement.classList.add('bare');

const en = (q.get('ui') || 'ru').startsWith('en');
let local;
let connectedName;
if (q.get('demo')) {
  // [ссылка, имя по-русски, имя по-английски, пинг]
  const links = [
    ['vless://u@1.1.1.1:443?security=reality&pbk=K&sid=1&sni=a.com&flow=xtls-rprx-vision', '🇳🇱 Нидерланды #1', '🇳🇱 Netherlands #1', 42],
    ['hy2://p@2.2.2.2:443?sni=b.com', '🇫🇮 Финляндия · Hysteria2', '🇫🇮 Finland · Hysteria2', 37],
    ['vless://u@1.1.1.2:443?security=reality&pbk=K&sid=1&sni=a.com&flow=xtls-rprx-vision', '🇩🇪 Германия #1', '🇩🇪 Germany #1', 58],
    ['vless://u@1.1.1.6:443?security=reality&pbk=K&sid=1&sni=a.com&type=xhttp&path=%2F', '🇸🇪 Швеция · XHTTP', '🇸🇪 Sweden · XHTTP', 71],
    ['vless://u@1.1.1.3:443?security=tls&type=ws&path=/ws', '🇬🇧 Великобритания', '🇬🇧 United Kingdom', 96],
    ['trojan://p@3.3.3.3:443?sni=c.com', '🇺🇸 США · Нью-Йорк', '🇺🇸 USA · New York', 148],
    ['tuic://a:b@t.com:443?sni=t.com', '🇯🇵 Япония · TUIC', '🇯🇵 Japan · TUIC', 212],
    ['ss://YWVzLTI1Ni1nY206cGFzcw@5.6.7.8:8388', '🇹🇷 Турция', '🇹🇷 Turkey', 305],
  ];
  const nodes = links.map(([l, ru, enName]) => ({ ...parseLink(l + '#x'), name: en ? enName : ru }));
  const auto = { id: 'auto', name: en ? '⚡ Auto — fastest server' : '⚡ Авто — самый быстрый', type: 'urltest', label: 'Авто · 8', server: '', port: 0,
    outbound: { type: 'urltest', outbounds: [] }, members: new Array(8).fill({}) };
  const latency = Object.fromEntries(nodes.map((n, i) => [n.id, links[i][3]]));
  local = {
    subs: [{ id: 's1', url: 'https://sub.example/abc', name: 'M-VPN', nodes: [auto, ...nodes], updatedAt: Date.now() - 20 * 60e3,
      userinfo: { upload: 1.6e9, download: 17.2e9, total: 200 * 2 ** 30, expire: 1830297600 } }],
    manual: [], selectedId: nodes[0].id, latency,
    settings: {
      mode: 'except', exceptList: en ? 'mybank.com\nlocal-news.com\nmail.example.org' : 'ru\nрф\nsu\nby', onlyList: '', port: 10808, updateHours: 12,
      userAgent: 'M-Link/1.1.0', webrtcProtect: true, killSwitch: false, lang: 'auto', siteRules: {},
    },
  };
  connectedName = nodes[0].name;
} else {
  const sub = parseSubscription([
    'vless://u@1.1.1.1:443?security=reality&pbk=K&sid=1&sni=a.com&flow=xtls-rprx-vision#🇳🇱 Нидерланды',
    'vless://u@1.1.1.2:443?security=reality&pbk=K&sid=1&sni=a.com#🇩🇪 Германия',
    'hy2://p@2.2.2.2:443?sni=b.com#🇫🇮 Финляндия Hy2',
    'vless://u@1.1.1.3:443?security=tls&type=ws&path=/ws#🇺🇸 США CDN',
    'vless://u@1.1.1.4:443?security=tls&type=xhttp#🇯🇵 Япония XHTTP',
  ].join('\n')).nodes;
  const manual = [parseLink('tuic://a:b@t.com:443?sni=t.com#Мой TUIC')];
  const lat = { [sub[0].id]: 84, [sub[1].id]: 412, [sub[2].id]: 57, [sub[3].id]: -1 };
  local = q.get('empty') ? { subs: [], manual: [] } : {
    subs: [{ id: 's1', url: 'https://sub.example/abc', name: 'M-VPN Premium', nodes: sub, updatedAt: Date.now() - 3600e3,
      userinfo: { upload: 2.1e9, download: 14.3e9, total: 100 * 2 ** 30, expire: 1798761600 } }],
    manual, selectedId: sub[0].id, latency: lat,
    settings: { mode: 'except', exceptList: 'ru\nsu\nрф\nby', onlyList: '', port: 10808, updateHours: 12, userAgent: 'M-Link/1.0' },
  };
  connectedName = sub[0].name;
}
const st = q.get('state') || 'off';
const session = { status: st === 'on' ? { state: 'on', nodeName: connectedName, since: Date.now() - 754e3 }
  : st === 'error' ? { state: 'error', code: 'no_helper', error: 'Помощник не установлен. Он нужен, чтобы работали VLESS, Hysteria2 и другие протоколы.' }
  : { state: 'off' }, testing: null };
const area = (data) => ({ get: async (d) => ({ ...d, ...data }), set: async () => {} });
const noHelper = { ok: true, installed: false, code: 'no_helper', error: 'Помощник не установлен.' };
const helperOk = { ok: true, installed: true, version: q.get('oldhelper') ? '0.1.0' : '1.1.0', core: '1.14.4', xray: '26.11.9',
  corePath: '~/Library/Application Support/MLink/sing-box', outdated: !!q.get('oldhelper'), canSelfUpdate: !q.get('oldhelper'),
  latest: q.get('update') ? '1.2.0' : '1.1.0', updateAvailable: !!q.get('update') };
// Демо-скорость: счётчики растут примерно на 4,6 МБ/с вниз и 180 КБ/с вверх.
const t0 = Date.now();
const fakeStats = () => {
  const s = (Date.now() - t0) / 1000;
  return { ok: true, available: true, down: Math.round(s * 4.6 * 2 ** 20), up: Math.round(s * 180 * 1024), at: Date.now() };
};
window.chrome = {
  storage: { local: area(local), session: area(session), onChanged: { addListener() {} } },
  tabs: { query: async () => [{ url: q.get('tab') || 'https://www.youtube.com/watch?v=1' }] },
  i18n: { getUILanguage: () => q.get('ui') || 'ru' },
  runtime: {
    getManifest: () => ({ version: '1.1.0' }),
    getPlatformInfo: async () => ({ os: q.get('os') || 'mac', arch: 'arm64' }),
    sendMessage: async (m) => (m.type === 'stats' ? fakeStats()
      : m.type === 'helperInfo' ? (q.get('nohelper') ? noHelper : helperOk)
      : q.get('nohelper') && ['test', 'connect', 'add', 'updateAll'].includes(m.type)
        ? { ok: false, code: 'no_helper', error: 'Помощник не установлен.' }
        : { ok: true, added: 0, tested: 0 }),
  },
};
const html = await (await fetch('../extension/popup.html')).text();
const doc = new DOMParser().parseFromString(html, 'text/html');
doc.querySelectorAll('script').forEach((s) => s.remove());
doc.querySelectorAll('img').forEach((i) => i.setAttribute('src', '../extension/' + i.getAttribute('src')));
document.body.innerHTML = doc.body.innerHTML;
await import('../extension/popup.js');
await new Promise((r) => setTimeout(r, 50));
if (q.get('view') === 'settings') document.getElementById('open-settings').click();
if (q.get('add') !== null) {
  document.getElementById('add-panel').hidden = false;
  document.getElementById('add-input').value = q.get('add');
}
document.documentElement.dataset.ready = '1';
</script>
<body></body>
