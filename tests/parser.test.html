<!doctype html><meta charset="utf-8"><title>parser tests</title>
<style>body{font:13px monospace;padding:12px}.f{color:#c00}.p{color:#080}</style>
<pre id="out"></pre>
<script type="module">
import { parseLink, parseSubscription, parseUserInfo, parseProfileTitle } from '../extension/lib/parser.js';
import { buildPac, normalizeDomains, buildRunConfig, buildNodeConfig, normalizeRules, routeForHost, siteDomain } from '../extension/lib/singbox.js';
const fx = await (await fetch('fixtures.json')).json();
const out = document.getElementById('out');
let pass = 0, fail = 0;
function eq(name, got, want) {
  const g = JSON.stringify(got), w = JSON.stringify(want);
  const ok = g === w;
  ok ? pass++ : fail++;
  out.innerHTML += `<span class="${ok ? 'p' : 'f'}">${ok ? 'PASS' : 'FAIL'}</span> ${name}${ok ? '' : `\n   got:  ${g}\n   want: ${w}`}\n`;
}
function t(name, fn) { try { fn(); } catch (e) { fail++; out.innerHTML += `<span class="f">FAIL</span> ${name}: ${e.message}\n`; } }

t('vless reality', () => {
  const n = parseLink('vless://11111111-2222-3333-4444-555555555555@1.2.3.4:443?encryption=none&flow=xtls-rprx-vision-udp443&security=reality&sni=www.microsoft.com&fp=chrome&pbk=PUBKEY&sid=abcd&type=tcp#%F0%9F%87%B3%F0%9F%87%B1%20Netherlands');
  eq('vless reality: name', n.name, '🇳🇱 Netherlands');
  eq('vless reality: label', n.label, 'VLESS Reality');
  eq('vless reality: outbound', n.outbound, { type: 'vless', server: '1.2.3.4', server_port: 443, uuid: '11111111-2222-3333-4444-555555555555', flow: 'xtls-rprx-vision',
    tls: { enabled: true, server_name: 'www.microsoft.com', utls: { enabled: true, fingerprint: 'chrome' }, reality: { enabled: true, public_key: 'PUBKEY', short_id: 'abcd' } }, packet_encoding: 'xudp' });
});
t('vless ws early data', () => {
  const n = parseLink('vless://u@host.com:443?security=tls&type=ws&path=%2Fws%3Fed%3D2048&host=cdn.host.com#ws');
  eq('vless ws: transport', n.outbound.transport, { type: 'ws', max_early_data: 2048, early_data_header_name: 'Sec-WebSocket-Protocol', path: '/ws', headers: { Host: 'cdn.host.com' } });
  eq('vless ws: sni default = host', n.outbound.tls.server_name, 'host.com');
});
t('vless grpc', () => {
  const n = parseLink('vless://u@[2001:db8::1]:8443?security=tls&type=grpc&serviceName=gun&sni=g.com#g');
  eq('vless grpc ipv6 server', n.outbound.server, '2001:db8::1');
  eq('vless grpc transport', n.outbound.transport, { type: 'grpc', service_name: 'gun' });
});
t('vless xhttp -> xray node', () => {
  const n = parseLink('vless://u1@h.com:443?security=tls&type=xhttp&path=%2Fxp&host=cdn.h.com&mode=auto&sni=s.com&fp=chrome&alpn=h2&extra=%7B%22xPaddingBytes%22%3A%22100-1000%22%7D#x');
  eq('xhttp: core xray, no sing-box outbound', [n.core, n.unsupported, n.outbound, n.label], ['xray', undefined, undefined, 'VLESS XHTTP']);
  eq('xhttp: xray outbound', n.xray, { protocol: 'vless', settings: { vnext: [{ address: 'h.com', port: 443, users: [{ id: 'u1', encryption: 'none' }] }] },
    streamSettings: { network: 'xhttp', security: 'tls', tlsSettings: { serverName: 's.com', fingerprint: 'chrome', alpn: ['h2'] },
      xhttpSettings: { path: '/xp', host: 'cdn.h.com', mode: 'auto', extra: { xPaddingBytes: '100-1000' } } } });
  const r = parseLink('vless://u2@1.2.3.4:443?security=reality&type=xhttp&pbk=PK&sid=ab&sni=r.com&path=%2F#r');
  eq('xhttp reality', r.xray.streamSettings.realitySettings, { serverName: 'r.com', fingerprint: 'chrome', publicKey: 'PK', shortId: 'ab' });
});
t('vmess', () => {
  const n = parseLink(fx.vmess);
  eq('vmess name', n.name, 'VMess WS');
  eq('vmess outbound', n.outbound, { type: 'vmess', server: 'vm.example.com', server_port: 443, uuid: '11111111-2222-3333-4444-555555555555', security: 'auto', alter_id: 0,
    tls: { enabled: true, server_name: 'vm.example.com', utls: { enabled: true, fingerprint: 'chrome' } }, transport: { type: 'ws', path: '/vm', headers: { Host: 'cdn.example.com' } }, packet_encoding: 'xudp' });
});
t('trojan', () => {
  const n = parseLink('trojan://p%40ss@t.example.com:443?sni=t.example.com&allowInsecure=1#tro');
  eq('trojan outbound', n.outbound, { type: 'trojan', server: 't.example.com', server_port: 443, password: 'p@ss', tls: { enabled: true, server_name: 't.example.com', insecure: true } });
});
t('ss variants', () => {
  eq('ss sip002 base64', parseLink('ss://YWVzLTI1Ni1nY206cGFzcw@5.6.7.8:8388#ss1').outbound, { type: 'shadowsocks', server: '5.6.7.8', server_port: 8388, method: 'aes-256-gcm', password: 'pass' });
  eq('ss 2022 plain', parseLink('ss://2022-blake3-aes-128-gcm:a%2Bb%3D@5.6.7.8:443#x').outbound.password, 'a+b=');
  const old = parseLink(fx.ssLegacy);
  eq('ss legacy', [old.name, old.outbound.server, old.outbound.server_port, old.outbound.method], ['old', '9.9.9.9', 1234, 'aes-128-gcm']);
  eq('ss obfs plugin', parseLink('ss://YWVzLTI1Ni1nY206cGFzcw@5.6.7.8:8388/?plugin=obfs-local%3Bobfs%3Dhttp%3Bobfs-host%3Da.com#p').outbound.plugin_opts, 'obfs=http;obfs-host=a.com');
});
t('hysteria2', () => {
  const n = parseLink('hysteria2://pa%3Ass@hy.example.com:443?sni=hy.example.com&obfs=salamander&obfs-password=xyz&insecure=1#hy2');
  eq('hy2 outbound', n.outbound, { type: 'hysteria2', server: 'hy.example.com', server_port: 443, password: 'pa:ss',
    tls: { enabled: true, server_name: 'hy.example.com', insecure: true, alpn: ['h3'] }, obfs: { type: 'salamander', password: 'xyz' } });
  const m = parseLink('hy2://pass@1.1.1.1:443,20000-30000/?sni=a.com#multi');
  eq('hy2 port hopping', [m.outbound.server_port, m.outbound.server_ports], [443, ['443:443', '20000:30000']]);
  const mp = parseLink('hy2://pass@1.1.1.1:443?mport=40000-50000#m');
  eq('hy2 mport', mp.outbound.server_ports, ['40000:50000']);
});
t('tuic', () => {
  const n = parseLink('tuic://uuid1:pw@t.com:443?congestion_control=bbr&alpn=h3&sni=t.com&udp_relay_mode=native#tuic');
  eq('tuic outbound', n.outbound, { type: 'tuic', server: 't.com', server_port: 443, uuid: 'uuid1', password: 'pw', congestion_control: 'bbr', udp_relay_mode: 'native', tls: { enabled: true, server_name: 't.com', alpn: ['h3'] } });
});
t('subscription base64 + dedupe', () => {
  const r = parseSubscription(fx.sub);
  eq('sub nodes', r.nodes.map((n) => [n.name, n.type]), [['A', 'vless'], ['B', 'hysteria2']]);
});
t('subscription sing-box json', () => {
  const r = parseSubscription(JSON.stringify({ outbounds: [{ type: 'selector', tag: 'sel', outbounds: ['x'] }, { type: 'vless', tag: 'NL', server: 'a.com', server_port: 443, uuid: 'u' }, { type: 'direct', tag: 'direct' }] }));
  eq('sing-box json nodes', r.nodes.map((n) => [n.name, n.outbound.tag]), [['NL', undefined]]);
});
t('xray json subscription', () => {
  const sub = [
    { remarks: '🇳🇱 NL', outbounds: [
      { tag: 'proxy', protocol: 'vless', settings: { vnext: [{ address: 'a.com', port: 443, users: [{ id: 'u1', encryption: 'none', flow: 'xtls-rprx-vision' }] }] },
        streamSettings: { network: 'tcp', security: 'reality', realitySettings: { serverName: 'sni.com', fingerprint: 'qq', publicKey: 'PK', shortId: 'ab' } } },
      { tag: 'direct', protocol: 'freedom' }, { tag: 'block', protocol: 'blackhole' }] },
    { remarks: 'Hy2', outbounds: [{ tag: 'hy', protocol: 'hysteria', settings: { version: 2, address: 'h.com', port: 443 },
        streamSettings: { network: 'hysteria', security: 'tls', tlsSettings: { serverName: 'h.com', alpn: ['h3'] }, hysteriaSettings: { version: 2, auth: 'secret' } } }] },
    { remarks: 'SS', outbounds: [{ tag: 'proxy', protocol: 'shadowsocks', settings: { address: '1.2.3.4', port: 8388, method: 'chacha20-ietf-poly1305', password: 'pw' } }] },
    { remarks: 'WS', outbounds: [{ tag: 'proxy', protocol: 'vless', settings: { vnext: [{ address: 'w.com', port: 443, users: [{ id: 'u2' }] }] },
        streamSettings: { network: 'ws', security: 'tls', wsSettings: { path: '/p?ed=2048', host: '' }, tlsSettings: { serverName: 'w.com', fingerprint: 'firefox' } } }] },
    { remarks: 'XH', outbounds: [{ tag: 'proxy', protocol: 'vless', settings: { vnext: [{ address: 'x.com', port: 443, users: [{ id: 'u3' }] }] },
        streamSettings: { network: 'xhttp', security: 'tls', xhttpSettings: { path: '/' } } }] },
    { remarks: 'Авто', outbounds: [
      { tag: 'fast-1', protocol: 'trojan', settings: { servers: [{ address: 't.com', port: 443, password: 'tp' }] }, streamSettings: { network: 'tcp', security: 'tls', tlsSettings: { serverName: 't.com' } } },
      { tag: 'fast-2', protocol: 'vless', settings: { vnext: [{ address: 'x.com', port: 443, users: [{ id: 'u3' }] }] }, streamSettings: { network: 'xhttp' } },
      { tag: 'direct', protocol: 'freedom' }],
      burstObservatory: { pingConfig: { destination: 'https://www.google.com/generate_204' } } },
  ];
  const r = parseSubscription(JSON.stringify(sub));
  eq('xray: names', r.nodes.map((n) => n.name), ['🇳🇱 NL', 'Hy2', 'SS', 'WS', 'XH', 'Авто']);
  eq('xray: vless reality', r.nodes[0].outbound, { type: 'vless', server: 'a.com', server_port: 443, uuid: 'u1', flow: 'xtls-rprx-vision', packet_encoding: 'xudp',
    tls: { enabled: true, server_name: 'sni.com', utls: { enabled: true, fingerprint: 'qq' }, reality: { enabled: true, public_key: 'PK', short_id: 'ab' } } });
  eq('xray: hysteria v2 -> hysteria2', r.nodes[1].outbound, { type: 'hysteria2', server: 'h.com', server_port: 443, password: 'secret', tls: { enabled: true, server_name: 'h.com', alpn: ['h3'] } });
  eq('xray: ss flat settings', r.nodes[2].outbound, { type: 'shadowsocks', server: '1.2.3.4', server_port: 8388, method: 'chacha20-ietf-poly1305', password: 'pw' });
  eq('xray: ws early data', r.nodes[3].outbound.transport, { type: 'ws', max_early_data: 2048, early_data_header_name: 'Sec-WebSocket-Protocol', path: '/p' });
  eq('xray: xhttp -> xray node keeps original outbound', [r.nodes[4].core, r.nodes[4].xray.streamSettings.xhttpSettings, r.nodes[4].xray.tag], ['xray', { path: '/' }, undefined]);
  eq('xray: auto group', [r.nodes[5].label, r.nodes[5].outbound.type, r.nodes[5].outbound.outbounds, r.nodes[5].members.map((m) => m.type)], ['Авто · 1', 'urltest', ['m0'], ['trojan']]);
  const cfg = buildRunConfig(r.nodes[5].outbound, { port: 1, members: r.nodes[5].members });
  eq('xray: group run config', cfg.outbounds.map((o) => o.tag), ['proxy', 'm0', 'direct']);
});
t('sing-box json not mistaken for xray', () => {
  eq('sing-box json still works', parseSubscription(JSON.stringify({ outbounds: [{ type: 'vless', tag: 'A', server: 'a', server_port: 1, uuid: 'u' }] })).nodes.length, 1);
});
t('panel placeholders (frozen / expired subscription)', () => {
  const links = parseSubscription([
    'vless://00000000-0000-0000-0000-000000000000@0.0.0.0:1?encryption=none&type=tcp#%E2%9B%94%20%D0%9F%D0%BE%D0%B4%D0%BF%D0%B8%D1%81%D0%BA%D0%B0%20%D0%B7%D0%B0%D0%BC%D0%BE%D1%80%D0%BE%D0%B6%D0%B5%D0%BD%D0%B0',
    'trojan://x@127.0.0.1:1#Продлите в боте @bot',
    'vless://u@1.2.3.4:443?security=tls#Real',
  ].join('\n')).nodes;
  eq('links: placeholders become info', links.map((n) => [n.name, !!n.info]), [['⛔ Подписка заморожена', true], ['Продлите в боте @bot', true], ['Real', false]]);
  eq('info node has no outbound', links[0].outbound, undefined);
  const xray = parseSubscription(JSON.stringify([
    { remarks: '⛔ Подписка заморожена', outbounds: [{ protocol: 'blackhole', tag: 'block' }] },
    { remarks: 'Продлите: @bot', outbounds: [{ protocol: 'vless', tag: 'proxy', settings: { vnext: [{ address: '0.0.0.0', port: 1, users: [{ id: '00000000-0000-0000-0000-000000000000' }] }] } }, { protocol: 'freedom', tag: 'direct' }] },
    { remarks: 'Bad placeholder', outbounds: [{ protocol: 'vless', settings: { vnext: [{ address: '0.0.0.0', port: 0, users: [{ id: 'x' }] }] }, streamSettings: { network: 'xhttp' } }] },
    { remarks: 'Авто', outbounds: [{ protocol: 'vless', tag: 'a', settings: { vnext: [{ address: '0.0.0.0', port: 1, users: [{ id: 'x' }] }] } }, { protocol: 'vless', tag: 'b', settings: { vnext: [{ address: '127.0.0.1', port: 1, users: [{ id: 'x' }] }] } }] },
    { remarks: '', outbounds: [{ protocol: 'freedom' }] },
  ])).nodes;
  eq('xray: placeholders become info', xray.map((n) => [n.name, !!n.info]), [['⛔ Подписка заморожена', true], ['Продлите: @bot', true], ['Bad placeholder', true], ['Авто', true]]);
});
t('site rules and routing', () => {
  const rules = normalizeRules({ 'https://www.YouTube.com/watch': 'proxy', 'ya.ru': 'direct', bad: 'x' });
  eq('normalizeRules', rules, { 'www.youtube.com': 'proxy', 'ya.ru': 'direct' });
  const opt = { mode: 'except', domains: ['ru'], rules: { 'ya.ru': 'proxy', 'youtube.com': 'direct' } };
  eq('rule beats list', routeForHost('mail.ya.ru', opt), { route: 'proxy', by: 'rule', match: 'ya.ru' });
  eq('list in except mode', routeForHost('vk.ru', opt), { route: 'direct', by: 'list', match: 'ru' });
  eq('rule beats mode', routeForHost('m.youtube.com', opt).route, 'direct');
  eq('mode default', routeForHost('google.com', opt), { route: 'proxy', by: 'mode' });
  eq('local', routeForHost('localhost', opt).by, 'local');
  eq('siteDomain', ['m.youtube.com', 'www.bbc.co.uk', 'example.org', 'a.b.yandex.ru', 'mail.ya.com.ru'].map(siteDomain), ['youtube.com', 'bbc.co.uk', 'example.org', 'yandex.ru', 'ya.com.ru']);
  const ctx = {
    dnsDomainIs: (h, d) => h.endsWith(d), isPlainHostName: (h) => !h.includes('.'),
    shExpMatch: (s, p) => new RegExp('^' + p.replace(/\./g, '\\.').replace(/\*/g, '.*') + '$').test(s),
  };
  const pac = (host) => new Function(...Object.keys(ctx), buildPac({ port: 1, mode: 'except', domains: ['ru'], rules: { 'ya.ru': 'proxy', 'mail.ya.ru': 'direct', 'youtube.com': 'direct' } }) + '\nreturn FindProxyForURL("", ' + JSON.stringify(host) + ');')(...Object.values(ctx));
  eq('pac: rule proxy over except list', pac('ya.ru').startsWith('SOCKS5'), true);
  eq('pac: longest rule wins', pac('mail.ya.ru'), 'DIRECT');
  eq('pac: direct rule in except mode', pac('www.youtube.com'), 'DIRECT');
  eq('pac: list still works', pac('vk.ru'), 'DIRECT');
});
t('node configs per core', () => {
  const x = parseLink('vless://u1@h.com:443?security=tls&type=xhttp#x');
  const c = buildNodeConfig(x, { port: 1081 });
  eq('xray config', [c.core, c.config.inbounds[0].protocol, c.config.inbounds[0].port, c.config.outbounds[0].tag, c.config.outbounds[0].protocol], ['xray', 'socks', 1081, 'proxy', 'vless']);
  const sb = buildNodeConfig(parseLink('hy2://p@h.com:443#h'), { port: 1081 });
  eq('sing-box config', [sb.core, sb.config.outbounds[0].type], ['sing-box', 'hysteria2']);
});
t('clash yaml message', () => {
  eq('clash yaml rejected with hint', parseSubscription('proxies:\n  - name: a').errors.length, 1);
});
t('headers', () => {
  eq('userinfo', parseUserInfo('upload=100; download=200; total=1000; expire=1767225600'), { upload: 100, download: 200, total: 1000, expire: 1767225600 });
  eq('profile-title base64', parseProfileTitle('base64:' + btoa(unescape(encodeURIComponent('Мой VPN')))), 'Мой VPN');
});
t('domains + pac', () => {
  eq('normalizeDomains', normalizeDomains('ru\nрф\nhttps://www.YouTube.com/watch?v=1\nx.com\n*.example.org'), ['ru', 'xn--p1ai', 'www.youtube.com', 'x.com', 'example.org']);
  const ctx = {
    dnsDomainIs: (h, d) => h.endsWith(d), isPlainHostName: (h) => !h.includes('.'),
    shExpMatch: (s, p) => new RegExp('^' + p.replace(/\./g, '\\.').replace(/\*/g, '.*') + '$').test(s),
  };
  const run = (mode, domains, host) => new Function(...Object.keys(ctx), buildPac({ port: 10808, mode, domains }) + '\nreturn FindProxyForURL("", ' + JSON.stringify(host) + ');')(...Object.values(ctx));
  const P = 'SOCKS5 127.0.0.1:10808; SOCKS 127.0.0.1:10808';
  eq('pac except: ya.ru direct', run('except', ['ru'], 'ya.ru'), 'DIRECT');
  eq('pac except: youtube proxied', run('except', ['ru'], 'www.youtube.com'), P);
  eq('pac except: guru.com not matched by "ru"', run('except', ['ru'], 'guru.com'), P);
  eq('pac only: sub.youtube.com proxied', run('only', ['youtube.com'], 'm.youtube.com'), P);
  eq('pac only: other direct', run('only', ['youtube.com'], 'ya.ru'), 'DIRECT');
  eq('pac all: localhost direct', run('all', [], 'localhost'), 'DIRECT');
  eq('pac all: lan direct', run('all', [], '192.168.1.1'), 'DIRECT');
});
t('run config', () => {
  const c = buildRunConfig({ type: 'vless', server: 'a', server_port: 1 }, { port: 10808 });
  eq('run config', [c.inbounds[0].listen_port, c.outbounds[0].tag, c.route.final], [10808, 'proxy', 'proxy']);
});
out.innerHTML = `<b>${pass} passed, ${fail} failed</b>\n\n` + out.innerHTML;
document.title = `${pass} passed, ${fail} failed`;
</script>
